[project]
name = "ledgerlock"
version = "0.1.0"
description = "Finance-ops reconciliation agent for payment aggregators"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.4",
    "rapidfuzz>=3.9.0",
    "faker>=28.0.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.8.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "langfuse>=2.40.0",
    "google-genai>=0.1.0",
    "google-generativeai>=0.8.0",
    "ollama>=0.3.0",
    "tabulate>=0.9.0",
    "crewai>=0.60.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "matching", "mcp_server", "rag", "eval", "api", "data"]
